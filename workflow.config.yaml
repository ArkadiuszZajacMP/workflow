linear:
  defaultTeam: BOO
slack:
  pollIntervalSeconds: 60
  backfillOnFirstRun: false
claude:
  model: null
triage:
  duplicateThreshold: 0.7
  searchClosedWithinDays: 90
  maxCandidates: 15
agent:
  containerEngine: podman
  maxConcurrent: 1
  prPollSeconds: 120
  workspaceRetentionDays: 7
  defaultRepos: []
  linearStatusOnImplement: null
rules:
  - when: { source: slack, reaction: eyes }
    category: triage
    action: triage-draft
  - when: { source: slack, reaction: bookmark }
    category: triage
  - when: { source: linear, status: Triage }
    category: triage
  - when: { source: linear, label: needs-investigation }
    category: triage
